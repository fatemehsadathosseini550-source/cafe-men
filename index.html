<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کافه لومیر</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #d4af37; margin-bottom: 20px; }
        .card { background: #262626; border-radius: 16px; padding: 15px; margin: 0 auto 30px auto; max-width: 400px; border: 1px solid #444; }
        .card img { width: 100%; border-radius: 12px; height: 200px; object-fit: cover; }
        model-viewer { width: 100%; height: 300px; margin-top: 10px; }
        .price { color: #d4af37; font-weight: bold; font-size: 1.2rem; margin: 10px 0; }
        .btn-ar { background: #d4af37; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>☕ کافه لومیر</h1>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=600&q=80">
        <h2>کافه لاته ویژه</h2>
        <div class="price">۸۵,۰۰۰ تومان</div>
        <model-viewer src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate>
            <button slot="ar-button" class="btn-ar">🚀 مشاهده AR</button>
        </model-viewer>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80">
        <h2>کیک شکلاتی مخصوص</h2>
        <div class="price">۱۱۰,۰۰۰ تومان</div>
        <model-viewer src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate>
            <button slot="ar-button" class="btn-ar">🚀 مشاهده AR</button>
        </model-viewer>
    </div>
</body>
</html>
