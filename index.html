<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کافه لومیر | منوی واقعیت افزوده</title>
    <!-- کتابخانه استاندارد نمایشگر سه‌بعدی و واقعیت افزوده -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #d4af37;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #888;
            margin-top: 0;
        }
        .menu-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        .menu-card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        .menu-card h3 {
            color: #d4af37;
            margin-top: 0;
        }
        /* تنظیمات نمایشگر سه بعدی روی صفحه */
        model-viewer {
            width: 100%;
            height: 260px;
            background-color: #242424;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        /* دکمه اختصاصی AR */
        .btn-ar {
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-ar:hover {
            background-color: #e6c55c;
        }
    </style>
</head>
<body>

    <h1>کافه لومیر</h1>
    <p class="subtitle">منوی هوشمند و واقعیت افزوده (AR)</p>

    <div class="menu-container">
        <!-- کارت کاپوچینو با مدل موجود در پوشه شما -->
        <div class="menu-card">
            <h3>کاپوچینو اختصاصی</h3>
            <p>فنجان مخصوص کافه با عطر و طعم بی‌نظیر</p>
            
            <!-- فایل cappuccino.glb مستقیماً فراخوانی شده است -->
            <model-viewer 
                src="cappuccino.glb" 
                ar 
                ar-modes="webxr scene-viewer quick-look" 
                camera-controls 
                auto-rotate
                shadow-intensity="1"
                alt="فنجان کاپوچینو اختصاصی کافه">
                
                <button slot="ar-button" class="btn-ar">
                    🚀 مشاهده در واقعیت افزوده روی میز
                </button>
            </model-viewer>
        </div>
    </div>

</body>
</html>
