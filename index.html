<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کافه لومیر - واقعیت افزوده واقعی روی میز</title>
    
    <!-- لودر رسمی مدل‌ویور گوگل برای AR استاندارد (مشابه ویدیو) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            background: #14120f; 
            color: #f4db98;
            font-family: Tahoma, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1914;
            border-bottom: 1px solid #b9964e;
        }
        header a { color: #f4db98; text-decoration: none; }
        
        .menu-container { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            margin: 20px auto;
        }
        .menu-container img { 
            width: 100%; 
            display: block; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .hotspot { 
            position: absolute; 
            top: 5%; 
            left: 60%; 
            width: 32%; 
            height: 18%; 
            border: 2px dashed #b9964e;
            background: rgba(185, 150, 78, 0.25);
            cursor: pointer;
            border-radius: 6px;
        }

        /* بخش نمایشگر مدل سه‌بعدی با قابلیت AR واقعی */
        #ar-view-container {
            display: none;
            position: fixed;
            inset: 0;
            background: #14120f;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        model-viewer {
            width: 100%;
            height: 80vh;
            background-color: #14120f;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: #b9964e;
            color: #14120f;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* دکمه اختصاصی ورود به محیط AR (دقیقاً مشابه دکمه‌های واقعیت افزوده گوگل/اپل) */
        #ar-button {
            background: #b9964e;
            color: #14120f;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(185,150,78,0.4);
            margin-bottom: 20px;
        }

        .hint {
            color: #f4db98;
            font-size: 13px;
            text-align: center;
            padding: 0 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <strong>کافه لومیر</strong>
        <a href="./index.html">بازگشت</a>
    </header>

    <div class="menu-container">
        <img src="./menu-768x1187.webp" alt="منوی کافه">
        <div class="hotspot" id="btn-espresso" title="مشاهده سفارش در واقعیت افزوده"></div>
    </div>

    <!-- پنل واقعیت افزوده مشابه ویدیو -->
    <div id="ar-view-container" style="display: none;">
        <button class="close-btn" onclick="closeARView()">بستن ✕</button>
        
        <model-viewer 
            id="espresso-model"
            src="https://modelviewer.dev/shared-assets/models/Cup.glb" 
            ios-src="https://modelviewer.dev/shared-assets/models/Cup.usdz"
            alt="فنجان اسپرسو ۳ بعدی"
            camera-controls
            auto-rotate
            shadow-intensity="1"
            ar
            ar-modes="scene-viewer quick-look webxr">
            
            <!-- دکمه‌ای که مرورگر برای قرار دادن روی میز باز می‌کند -->
            <button slot="ar-button" id="ar-button">
                🚀 نمایش روی میز (AR)
            </button>
        </model-viewer>

        <div class="hint">
            روی گوشی موبایل، دکمه «نمایش روی میز» را بزنید تا فنجان دقیقاً روی میز واقعی شما ظاهر شود.
        </div>
    </div>

    <script>
        const espressoBtn = document.getElementById('btn-espresso');
        const arContainer = document.getElementById('ar-view-container');

        espressoBtn.addEventListener('click', () => {
            arContainer.style.display = 'flex';
        });

        function closeARView() {
            arContainer.style.display = 'none';
        }
    </script>
</body>
</html>
