<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی کافه لومیر - سفارش روی میز</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            background: #14120f; 
            color: #f4db98;
            font-family: Tahoma, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        header {
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1914;
            border-bottom: 1px solid #b9964e;
        }
        header a { color: #f4db98; text-decoration: none; }
        
        .menu-container { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            margin: 20px auto;
        }
        .menu-container img { 
            width: 100%; 
            display: block; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* کادر روی گزینه اسپرسو در منو */
        .hotspot { 
            position: absolute; 
            top: 5%; 
            left: 60%; 
            width: 32%; 
            height: 18%; 
            border: 2px dashed #b9964e;
            background: rgba(185, 150, 78, 0.25);
            cursor: pointer;
            border-radius: 6px;
        }

        /* محیط نمایش دوربین و فنجان واقعی روی میز */
        #ar-camera-view {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999;
            overflow: hidden;
        }
        #webcam {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        /* تصویر فنجان اسپرسو روی میز */
        #real-cup {
            position: absolute;
            width: 240px;
            cursor: grab;
            z-index: 2;
            user-select: none;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8));
        }
        .close-camera-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: #b9964e;
            color: #14120f;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .instruction-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(28, 25, 20, 0.9);
            border: 1px solid #b9964e;
            color: #f4db98;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header>
        <strong>کافه لومیر</strong>
        <a href="./index.html">بازگشت</a>
    </header>

    <div class="menu-container">
        <img src="./menu.png" alt="منوی کافه">
        <div class="hotspot" id="btn-espresso" title="مشاهده سفارش روی میز"></div>
    </div>

    <!-- محیط دوربین برای دیدن سفارش واقعی روی میز -->
    <div id="ar-camera-view">
        <button class="close-camera-btn" onclick="closeCamera()">بستن دوربین ✕</button>
        
        <video id="webcam" autoplay playsinline></video>
        
        <!-- تصویر فنجان به صورت گرافیک داخلی و تضمینی -->
        <img id="real-cup" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 300 300'><circle cx='150' cy='150' r='120' fill='%23ffffff' stroke='%23b9964e' stroke-width='6'/><ellipse cx='150' cy='150' rx='80' ry='70' fill='%234a2e18'/><path d='M230 130 C260 130, 260 180, 230 180' stroke='%23ffffff' stroke-width='16' fill='none' stroke-linecap='round'/><text x='150' y='160' fill='%23f4db98' font-size='18' font-family='Tahoma' text-anchor='middle'>اسپرسو کافه</text></svg>" alt="فنجان اسپرسو">

        <div class="instruction-box">
            ☕ فنجان سفارش داده شده روی میز شماست (قابل جابجایی با انگشت)
        </div>
    </div>

    <script>
        const espressoBtn = document.getElementById('btn-espresso');
        const cameraView = document.getElementById('ar-camera-view');
        const videoElement = document.getElementById('webcam');
        const cup = document.getElementById('real-cup');

        let streamInstance = null;

        espressoBtn.addEventListener('click', async () => {
            cameraView.style.display = 'block';
            try {
                streamInstance = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                videoElement.srcObject = streamInstance;
            } catch (err) {
                alert('لطفاً دسترسی به دوربین را تایید کنید.');
                cameraView.style.display = 'none';
            }
        });

        function closeCamera() {
            if (streamInstance) {
                streamInstance.getTracks().forEach(track => track.stop());
            }
            cameraView.style.display = 'none';
        }

        window.addEventListener('load', () => {
            cup.style.left = (window.innerWidth / 2 - 120) + 'px';
            cup.style.top = (window.innerHeight / 2 - 120) + 'px';
        });

        let isDragging = false;
        let startX, startY, initialX = window.innerWidth / 2 - 120, initialY = window.innerHeight / 2 - 120;

        cup.addEventListener('touchstart', dragStart, {passive: true});
        cup.addEventListener('mousedown', dragStart);

        function dragStart(e) {
            isDragging = true;
            startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            startY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            document.addEventListener('touchmove', dragMove, {passive: true});
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('touchend', dragEnd);
            document.addEventListener('mouseup', dragEnd);
        }

        function dragMove(e) {
            if (!isDragging) return;
            let currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            let currentY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

            let dx = currentX - startX;
            let dy = currentY - startY;

            cup.style.left = (initialX + dx) + 'px';
            cup.style.top = (initialY + dy) + 'px';
        }

        (function() {
            function dragEnd() {
                isDragging = false;
                let rect = cup.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;

                document.removeEventListener('touchmove', dragMove);
                document.removeEventListener('mousemove', dragMove);
                document.removeEventListener('touchend', dragEnd);
                document.removeEventListener('mouseup', dragEnd);
            }
            window.dragEnd = dragEnd;
        })();
    </script>
</body>
</html>
