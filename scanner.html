<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی کافه لومیر - مدل ۳ بعدی روی میز</title>
    
    <!-- لودر رسمی گوگل برای مدل‌های سه بعدی -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            background: #14120f; 
            color: #f4db98;
            font-family: Tahoma, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        header {
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1914;
            border-bottom: 1px solid #b9964e;
        }
        header a { color: #f4db98; text-decoration: none; }
        
        .menu-container { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            margin: 20px auto;
        }
        .menu-container img { 
            width: 100%; 
            display: block; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* کادر روی گزینه اسپرسو در منو */
        .hotspot { 
            position: absolute; 
            top: 5%; 
            left: 60%; 
            width: 32%; 
            height: 18%; 
            border: 2px dashed #b9964e;
            background: rgba(185, 150, 78, 0.25);
            cursor: pointer;
            border-radius: 6px;
        }

        /* لایه کامل دوربین زنده */
        #ar-camera-view {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999;
            overflow: hidden;
        }
        #webcam {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* مدل سه بعدی شفاف روی تصویر زنده دوربین */
        #cup-3d-model {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            --poster-color: transparent;
            background-color: transparent;
        }

        .close-camera-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: #b9964e;
            color: #14120f;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .instruction-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(28, 25, 20, 0.9);
            border: 1px solid #b9964e;
            color: #f4db98;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header>
        <strong>کافه لومیر</strong>
        <a href="./index.html">بازگشت</a>
    </header>

    <div class="menu-container">
        <img src="./menu.png" alt="منوی کافه">
        <div class="hotspot" id="btn-espresso" title="مشاهده سفارش ۳ بعدی روی میز"></div>
    </div>

    <!-- محیط نمایش دوربین + مدل سه بعدی واقعی -->
    <div id="ar-camera-view">
        <button class="close-camera-btn" onclick="closeCamera()">بستن دوربین ✕</button>
        
        <!-- تصویر پس‌زمینه زنده دوربین (میز واقعی) -->
        <video id="webcam" autoplay playsinline></video>
        
        <!-- مدل ۳ بعدی فنجان اسپرسو با قابلیت چرخش ۳۶۰ درجه و زوم -->
        <model-viewer 
            id="cup-3d-model"
            src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CoffeeCup/glTF-Binary/CoffeeCup.glb" 
            alt="فنجان اسپرسو ۳ بعدی"
            camera-controls
            auto-rotate
            shadow-intensity="1.5"
            shadow-softness="1"
            exposure="1"
            ar
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>

        <div class="instruction-box">
            ☕ مدل ۳ بعدی فنجان روی میز: با انگشت بچرخانید و زوم کنید
        </div>
    </div>

    <script>
        const espressoBtn = document.getElementById('btn-espresso');
        const cameraView = document.getElementById('ar-camera-view');
        const videoElement = document.getElementById('webcam');

        let streamInstance = null;

        espressoBtn.addEventListener('click', async () => {
            cameraView.style.display = 'block';
            try {
                // فعال‌سازی دوربین عقب گوشی
                streamInstance = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { ideal: 'environment' } } 
                });
                videoElement.srcObject = streamInstance;
            } catch (err) {
                console.warn('دسترسی به دوربین داده نشد:', err);
                // حتی اگر کاربر دسترسی دوربین نداد، مدل سه بعدی در صفحه باز می‌ماند
            }
        });

        function closeCamera() {
            if (streamInstance) {
                streamInstance.getTracks().forEach(track => track.stop());
                streamInstance = null;
            }
            cameraView.style.display = 'none';
        }
    </script>
</body>
</html>
