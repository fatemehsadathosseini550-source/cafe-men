<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منوی کافه لومیر</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #14120f;
      color: #f4db98;
      font-family: Tahoma, sans-serif;
      text-align: center;
    }
    header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1914;
      border-bottom: 1px solid #b9964e;
    }
    a { color: #f4db98; text-decoration: none; }
    .hint { margin: 12px; font-size: 14px; }
    
    .menu-wrap {
      position: relative;
      width: min(100%, 600px);
      margin: 0 auto;
    }
    .menu-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
    .espresso-hotspot {
      position: absolute;
      left: 61%;
      top: 5.5%;
      width: 32%;
      height: 18%;
      border: 2px dashed #b9964e;
      background: rgba(185, 150, 78, 0.2);
      cursor: pointer;
    }

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      background: rgba(0, 0, 0, 0.85);
    }
    .viewer[hidden] { display: none; }
    .viewer-box {
      width: min(100%, 450px);
      padding: 16px;
      border: 1px solid #b9964e;
      border-radius: 16px;
      background: #1c1914;
    }
    .viewer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .close {
      padding: 6px 12px;
      color: #f4db98;
      background: transparent;
      border: 1px solid #b9964e;
      border-radius: 6px;
      cursor: pointer;
    }
    model-viewer {
      width: 100%;
      height: 360px;
      background: #201c17;
      border-radius: 10px;
    }
    .info-text {
      margin-top: 10px;
      font-size: 13px;
      color: #d1b87a;
    }
  </style>
</head>
<body>
  <header>
    <strong>کافه لومیر</strong>
    <a href="./index.html">بازگشت</a>
  </header>

  <p class="hint">روی کادر دور «اسپرسو» در منو کلیک کن:</p>

  <main class="menu-wrap">
    <img src="./menu.png" alt="منو">
    <button class="espresso-hotspot" id="btnEspresso" type="button"></button>
  </main>

  <div class="viewer" id="modal" hidden>
    <div class="viewer-box">
      <div class="viewer-top">
        <h3 style="margin:0;">فنجان قهوه اسپرسو</h3>
        <button class="close" id="btnClose">بستن ✕</button>
      </div>

      <!-- نمایش مدل سه‌بعدی با قابلیت چرخش و زوم روان بدون خطای دوربین گوشی -->
      <model-viewer 
        src="https://modelviewer.dev/shared-assets/models/CoffeeMug.glb"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        shadow-intensity="1">
      </model-viewer>

      <div class="info-text">با انگشت خود مدل را بچرخانید یا زوم کنید</div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    document.getElementById('btnEspresso').onclick = () => {
      modal.hidden = false;
    };
    document.getElementById('btnClose').onclick = () => {
      modal.hidden = true;
    };
  </script>
</body>
</html>
