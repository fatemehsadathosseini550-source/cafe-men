<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی کافه لومیر</title>
    <!-- Model Viewer CDN -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            background: #14120f; 
            color: #f4db98;
            font-family: Tahoma, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        header {
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1914;
            border-bottom: 1px solid #b9964e;
        }
        header a { color: #f4db98; text-decoration: none; }
        
        .menu-container { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            margin: 20px auto;
        }
        .menu-container img { 
            width: 100%; 
            display: block; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* کادر روی گزینه اسپرسو */
        .hotspot { 
            position: absolute; 
            top: 5%; 
            left: 60%; 
            width: 32%; 
            height: 18%; 
            border: 2px dashed #b9964e;
            background: rgba(185, 150, 78, 0.25);
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* پنهان کردن کامپوننت مدل سه‌بعدی از دید کاربر */
        #hidden-viewer {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <strong>کافه لومیر</strong>
        <a href="./index.html">بازگشت</a>
    </header>

    <div class="menu-container">
        <img src="./menu.png" alt="منوی کافه">
        <!-- کلیک روی این بخش مستقیماً دوربین AR را باز می‌کند -->
        <div class="hotspot" id="btn-espresso" title="مشاهده اسپرسو روی میز"></div>
    </div>

    <!-- مدل سه‌بعدی پنهان که فقط برای فعال‌سازی مستقیم AR استفاده می‌شود -->
    <model-viewer 
        id="hidden-viewer"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
        ar
        ar-modes="scene-viewer quick-look webxr"
        camera-controls>
    </model-viewer>

    <script>
        const espressoBtn = document.getElementById('btn-espresso');
        const viewer = document.getElementById('hidden-viewer');

        espressoBtn.addEventListener('click', () => {
            // به محض کلیک روی اسپرسو، مستقیماً دوربین AR باز می‌شود
            if (viewer.canActivateAR) {
                viewer.activateAR();
            } else {
                alert('قابلیت AR روی این مرورگر یا دستگاه پشتیبانی نمی‌شود. لطفاً با گوشی موبایل امتحان کنید.');
            }
        });
    </script>
</body>
</html>
