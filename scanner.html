<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منوی کافه لومیر</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111;
      color: #f4db98;
      font-family: Tahoma, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 18px;
      background: #171512;
      border-bottom: 1px solid #b9964e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    a { color: #f4db98; text-decoration: none; }
    main { max-width: 768px; margin: 0 auto; }
    #menu {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <span>منوی کافه لومیر</span>
    <a href="./index.html">بازگشت</a>
  </header>
  <main>
    <img id="menu" src="./menu.png" alt="تصویر کامل منوی کافه">
  </main>
</body>
</html>
