<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کافه لومیر - نمایش اسپرسو روی میز</title>

    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            background: #14120f; 
            color: #f4db98;
            font-family: Tahoma, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        header {
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1914;
            border-bottom: 1px solid #b9964e;
        }
        header a { color: #f4db98; text-decoration: none; }
        
        .menu-container { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            margin: 20px auto;
        }
        .menu-container img { 
            width: 100%; 
            display: block; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* کادر روی گزینه اسپرسو در منو */
        .hotspot { 
            position: absolute; 
            top: 5%; 
            left: 60%; 
            width: 32%; 
            height: 18%; 
            border: 2px dashed #b9964e;
            background: rgba(185, 150, 78, 0.25);
            cursor: pointer;
            border-radius: 6px;
        }

        /* لایه کامل دوربین زنده */
        #ar-camera-view {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999;
            overflow: hidden;
        }
        #webcam {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* فنجان اسپرسو باکیفیت روی تصویر دوربین */
        .cup-overlay-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            pointer-events: none; /* اجازه لمس دوربین برای فوکوس */
        }

        #espresso-photo {
            width: 260px;
            height: 260px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #b9964e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(185,150,78,0.4);
            animation: floatCup 3s ease-in-out infinite;
            pointer-events: auto;
        }

        @keyframes floatCup {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
        }

        .close-camera-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: #b9964e;
            color: #14120f;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .instruction-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(28, 25, 20, 0.9);
            border: 1px solid #b9964e;
            color: #f4db98;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header>
        <strong>کافه لومیر</strong>
        <a href="./index.html">بازگشت</a>
    </header>

    <div class="menu-container">
        <img src="./menu-768x1187.webp" alt="منوی کافه">
        <div class="hotspot" id="btn-espresso" title="مشاهده سفارش روی میز"></div>
    </div>

    <!-- محیط نمایش دوربین + فنجان روی میز -->
    <div id="ar-camera-view">
        <button class="close-camera-btn" onclick="closeCamera()">بستن دوربین ✕</button>
        
        <!-- تصویر زنده دوربین (میز واقعی) -->
        <video id="webcam" autoplay playsinline></video>
        
        <!-- عکس باکیفیت اسپرسو که وسط میز شناور است -->
        <div class="cup-overlay-wrapper">
            <img id="espresso-photo" src="./how-to-have-ideal-espresso-coffee.webp" alt="اسپرسو روی میز">
        </div>

        <div class="instruction-box">
            ☕ فنجان اسپرسو روی میز شما قرار گرفت
        </div>
    </div>

    <script>
        const espressoBtn = document.getElementById('btn-espresso');
        const cameraView = document.getElementById('ar-camera-view');
        const videoElement = document.getElementById('webcam');
        let streamInstance = null;

        espressoBtn.addEventListener('click', async () => {
            cameraView.style.display = 'block';
            try {
                streamInstance = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { ideal: 'environment' } } 
                });
                videoElement.srcObject = streamInstance;
            } catch (err) {
                console.log('Camera error:', err);
            }
        });

        function closeCamera() {
            if (streamInstance) {
                streamInstance.getTracks().forEach(track => track.stop());
                streamInstance = null;
            }
            cameraView.style.display = 'none';
        }
    </script>
</body>
</html>
