<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی کافه لومیر</title>
    <!-- Model Viewer CDN -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            background: #14120f; 
            color: #f4db98;
            font-family: Tahoma, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        header {
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1914;
            border-bottom: 1px solid #b9964e;
        }
        header a { color: #f4db98; text-decoration: none; }
        
        .menu-container { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            margin: 20px auto;
        }
        .menu-container img { 
            width: 100%; 
            display: block; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* کادر روی گزینه اسپرسو که مستقیماً دکمه AR را روی آن قرار می‌دهیم */
        .ar-hotspot {
            position: absolute;
            top: 5%;
            left: 60%;
            width: 32%;
            height: 18%;
            background: transparent;
            border: 2px dashed #b9964e;
            border-radius: 6px;
            cursor: pointer;
            padding: 0;
        }

        /* استایل دکمه AR داخلی برای اینکه دقیقاً کل کادر اسپرسو را پوشش دهد */
        model-viewer {
            width: 100%;
            height: 100%;
            background: transparent;
            border-radius: 6px;
        }

        /* استایل دکمه پیش‌فرض AR گوگل که روی منو قرار می‌گیرد */
        ::part(button) {
            background-color: #b9964e;
            color: #14120f;
            border-radius: 4px;
            border: none;
            font-family: Tahoma, sans-serif;
            font-size: 11px;
            padding: 4px 8px;
        }
    </style>
</head>
<body>

    <header>
        <strong>کافه لومیر</strong>
        <a href="./index.html">بازگشت</a>
    </header>

    <div class="menu-container">
        <img src="./menu.png" alt="منوی کافه">
        
        <!-- استفاده از خود model-viewer به عنوان کادر روی اسپرسو با قابلیت AR سراسری -->
        <div class="ar-hotspot">
            <model-viewer 
                src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
                ar
                ar-modes="scene-viewer quick-look webxr"
                camera-controls
                touch-action="pan-y">
                
                <!-- دکمه‌ای که با زدن روی آن در هر گوشی (اندروید/آیفون) ابزار AR باز می‌شود -->
                <button slot="ar-button" style="width: 100%; height: 100%; background: rgba(185, 150, 78, 0.3); border: 2px dashed #b9964e; border-radius: 6px; cursor: pointer; color: #fff; font-size: 12px; font-weight: bold;">
                    مشاهده روی میز ☕
                </button>
            </model-viewer>
        </div>
    </div>

</body>
</html>
