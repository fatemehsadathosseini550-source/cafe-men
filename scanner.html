<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسکنر AR منوی کاغذی - کافه لومیر</title>
    <!-- A-Frame و MindAR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.7);
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }
        .instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 20px;
            text-align: center;
            font-size: 14px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            width: 80%;
            max-width: 320px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← بازگشت به منو</a>

    <div class="instructions">
        دوربین را به سمت تصویر کارت تست (یا کارت نمونه روی لپ‌تاپ) بگیرید تا فنجان ظاهر شود.
    </div>

    <!-- صحنه AR با MindAR -->
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- مدل سه‌بعدی نمونه (فنجان یا آیتم کافه) -->
            <a-asset-item id="coffeeModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- اتصال مدل به تارگت شماره 0 -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#coffeeModel" 
                          position="0 0 0.1" 
                          scale="0.005 0.005 0.005" 
                          rotation="0 180 0">
            </a-gltf-model>
        </a-entity>
    </a-scene>

</body>
</html>
