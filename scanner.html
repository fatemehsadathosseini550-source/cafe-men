<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منوی سه‌بعدی و AR کافه لومیر</title>
  <!-- کتابخانه استاندارد model-viewer گوگل برای قابلیت AR -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #14120f;
      color: #f4db98;
      font-family: Tahoma, sans-serif;
    }
    header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1914;
      border-bottom: 1px solid #b9964e;
    }
    a { color: #f4db98; }
    .hint {
      margin: 16px;
      text-align: center;
      font-size: 14px;
    }
    .menu-wrap {
      position: relative;
      width: min(100%, 647px);
      margin: 0 auto;
    }
    .menu-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
    /* ناحیه کلیک روی اسپرسو در منو */
    .espresso-hotspot {
      position: absolute;
      left: 61%;
      top: 5.5%;
      width: 32%;
      height: 18%;
      border: 2px solid #b9964e;
      border-radius: 12px;
      background: rgba(185, 150, 78, 0.15);
      cursor: pointer;
    }
    .espresso-hotspot:active {
      background: rgba(185, 150, 78, 0.4);
    }
    /* پنجره مودال نمایش مدل و AR */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.88);
    }
    .viewer[hidden] { display: none; }
    .viewer-box {
      width: min(100%, 500px);
      padding: 16px;
      border: 1px solid #b9964e;
      border-radius: 18px;
      background: #1c1914;
      text-align: center;
    }
    .viewer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .viewer-top h2 { margin: 0; font-size: 18px; }
    .close {
      padding: 6px 12px;
      color: #f4db98;
      background: transparent;
      border: 1px solid #b9964e;
      border-radius: 8px;
      cursor: pointer;
    }
    /* تگ model-viewer برای چرخش و واقعیت افزوده روی میز */
    model-viewer {
      width: 100%;
      height: 350px;
      background-color: #26221c;
      border-radius: 12px;
    }
    /* دکمه AR که روی گوشی ظاهر می‌شود */
    #ar-button {
      background: #b9964e;
      color: #14120f;
      border-radius: 8px;
      border: none;
      padding: 10px 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      font-family: Tahoma, sans-serif;
    }
  </style>
</head>
<body>
  <header>
    <strong>منوی کافه لومیر</strong>
    <a href="./index.html">بازگشت</a>
  </header>

  <p class="hint">روی بخش «اسپرسو» در منو بزن تا مدل و قابلیت قرار دادن روی میز باز شود.</p>

  <main class="menu-wrap">
    <img src="./menu.png" alt="تصویر منوی کافه">
    <button class="espresso-hotspot" id="espressoButton" type="button" aria-label="مدل سه‌بعدی اسپرسو"></button>
  </main>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-box" role="dialog" aria-modal="true" aria-label="مدل سه‌بعدی اسپرسو">
      <div class="viewer-top">
        <h2>اسپرسو ☕</h2>
        <button class="close" id="closeButton" type="button">بستن ×</button>
      </div>

      <!-- فایل مدل استاندارد با قابلیت AR مجهز به موتور گوگل -->
      <model-viewer 
        id="modelViewer"
        src="https://modelviewer.dev/shared-assets/models/CoffeeMug.glb"
        ar
        ar-modes="scene-viewer quick-look webxr"
        camera-controls
        auto-rotate
        shadow-intensity="1">
        
        <button slot="ar-button" id="ar-button">
          📱 مشاهده روی میز (AR)
        </button>
      </model-viewer>
    </div>
  </div>

  <script>
    const viewer = document.getElementById("viewer");
    const modelViewer = document.getElementById("modelViewer");

    document.getElementById("espressoButton").addEventListener("click", () => {
      viewer.hidden = false;
      document.body.style.overflow = "hidden";
    });

    function closeViewer() {
      viewer.hidden = true;
      document.body.style.overflow = "";
    }

    document.getElementById("closeButton").addEventListener("click", closeViewer);

    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) closeViewer();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !viewer.hidden) closeViewer();
    });
  </script>
</body>
</html>
