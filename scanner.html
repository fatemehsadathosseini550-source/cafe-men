<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>اسکنر AR منوی کاغذی | کافه لومیر</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastinfar/vazirmatn-font@v33.003/Vazirmatn-font-face.css">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Vazirmatn', sans-serif; }
        .top-nav { position: fixed; top: 20px; right: 20px; left: 20px; display: flex; justify-content: space-between; z-index: 1000; }
        .back-btn { background: rgba(0, 0, 0, 0.75); border: 1px solid #d4af37; color: #d4af37; padding: 8px 18px; border-radius: 20px; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        .scan-guide { position: fixed; top: 75px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 0.8rem; z-index: 1000; border: 1px solid rgba(255,255,255,0.2); white-space: nowrap; }
        .items-selector { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(10px); padding: 10px 14px; border-radius: 35px; border: 1px solid #d4af37; z-index: 1000; width: 90%; max-width: 450px; overflow-x: auto; }
        .select-btn { background: #2a2a2a; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 8px 14px; border-radius: 20px; font-family: 'Vazirmatn'; font-size: 0.8rem; white-space: nowrap; cursor: pointer; }
        .select-btn.active { background: #d4af37; color: #111; font-weight: bold; border-color: #d4af37; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="index.html" class="back-btn">✕ خروج از اسکنر</a>
    </div>
    <div class="scan-guide">📄 دوربین را به سمت برگه منو بگیرید</div>

    <div class="items-selector">
        <button class="select-btn active" onclick="switchItem('https://modelviewer.dev/shared-assets/models/Astronaut.glb', this)">☕ کافه لاته</button>
        <button class="select-btn" onclick="switchItem('https://modelviewer.dev/shared-assets/models/Astronaut.glb', this)">☕ اسپرسو</button>
        <button class="select-btn" onclick="switchItem('https://modelviewer.dev/shared-assets/models/Astronaut.glb', this)">🧊 آیس لاته</button>
        <button class="select-btn" onclick="switchItem('https://modelviewer.dev/shared-assets/models/Astronaut.glb', this)">🍰 کیک شکلاتی</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model id="arModel" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" position="0 0 0" scale="0.15 0.15 0.15" rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000"></a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        function switchItem(modelUrl, btn) {
            document.querySelectorAll('.select-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('arModel').setAttribute('src', modelUrl);
        }
    </script>
</body>
</html>
