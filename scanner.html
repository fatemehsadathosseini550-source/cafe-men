<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>اسکن منوی کافه | AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- کتابخانه مدل‌ویور برای نمایش مدل‌های واقعی سه‌بعدی -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #10100e;
      font-family: Tahoma, sans-serif;
    }

    #back {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10000;
      padding: 11px 16px;
      color: #f4db98;
      background: rgba(20, 18, 15, .85);
      border: 1px solid #b9964e;
      border-radius: 14px;
      text-decoration: none;
    }

    #status {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      width: min(88vw, 430px);
      box-sizing: border-box;
      padding: 13px;
      color: white;
      background: rgba(20, 18, 15, .88);
      border: 1px solid #b9964e;
      border-radius: 15px;
      text-align: center;
      line-height: 1.8;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <a id="back" href="index.html">بازگشت به منو</a>
  <div id="status">دوربین را بگیرید روی تصویر منو...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse"
      raycaster="objects: .clickable; far: 10000">
    </a-camera>

    <!-- هدف اول: روی منو شناسایی میشود -->
    <a-entity id="menu-target" mindar-image-target="targetIndex: 0">

      <!-- یک دکمه یا ناحیه کلیک روی عکس -->
      <a-plane id="coffee-hit" class="clickable"
        position="0 0 0"
        width="0.8" height="0.4"
        material="color: #b9964e; opacity: 0.35; transparent: true; side: double">
      </a-plane>

      <!-- مدل سه‌بعدی واقعی فنجان قهوه که با پیدا شدن منو ظاهر می‌شود -->
      <a-entity position="0 0 0.1" scale="0.8 0.8 0.8">
        <a-gltf-model src="https://modelviewer.dev/shared-assets/models/Cup.glb"></a-gltf-model>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const statusBox = document.querySelector("#status");
    const target = document.querySelector("#menu-target");

    target.addEventListener("targetFound", () => {
      statusBox.textContent = "منو با موفقیت اسکن شد! فنجان قهوه سه‌بعدی روی آن ظاهر شد.";
    });

    target.addEventListener("targetLost", () => {
      statusBox.textContent = "منو از کادر خارج شد. دوباره دوربین را بگیرید.";
    });
  </script>
</body>
</html>
