<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>اسکنر AR کافه</title>

  <!-- کتابخانه‌های A-Frame و MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* تنظیمات کلیدی برای جلوگیری از صفحه سیاه در اندروید و آیفون */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* اجبار به نمایش ویدیوی دوربین در زیر تمام المان‌ها برای تمام مرورگرها */
    canvas {
      position: absolute !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 10 !important;
      background: transparent !important;
    }

    video {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      min-width: 100% !important;
      min-height: 100% !important;
      object-fit: cover !important;
      z-index: 1 !important;
    }

    /* دکمه بازگشت */
    #back {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 999999;
      padding: 10px 18px;
      color: #f4db98;
      background: rgba(20, 18, 15, 0.85);
      border: 1px solid #b9964e;
      border-radius: 12px;
      text-decoration: none;
      font-family: Tahoma, sans-serif;
      font-size: 14px;
    }

    /* کادر وضعیت پایین صفحه */
    #status {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      width: min(90vw, 400px);
      padding: 14px;
      color: white;
      background: rgba(20, 18, 15, 0.9);
      border: 1px solid #b9964e;
      border-radius: 14px;
      text-align: center;
      font-family: Tahoma, sans-serif;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <a id="back" href="index.html">بازگشت به منو</a>
  <div id="status">درخواست دسترسی به دوربین...</div>

  <!-- صحنه AR -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: yes; uiError: yes; uiScanning: yes;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- هدف شناسایی منو (تارگت شماره ۰) -->
    <a-entity id="menu-target" mindar-image-target="targetIndex: 0">
      <!-- تست بصری روی منو (یک مکعب قرمز کوچک) -->
      <a-box position="0 0 0.1" scale="0.1 0.1 0.1" color="#d44b59"></a-box>
    </a-entity>
  </a-scene>

  <script>
    const statusBox = document.getElementById("status");
    const target = document.getElementById("menu-target");
    const scene = document.querySelector("a-scene");

    // چک کردن لحظه‌ای ویدیو برای اطمینان از نمایش در اندروید و آیفون
    setInterval(() => {
      const videoEl = document.querySelector("video");
      if (videoEl) {
        videoEl.style.display = "block";
        videoEl.style.zIndex = "1";
      }
    }, 300);

    scene.addEventListener("arReady", () => {
      statusBox.textContent = "دوربین آماده است؛ منوی کافه را اسکن کنید.";
    });

    scene.addEventListener("arError", (e) => {
      statusBox.textContent = "خطا در دسترسی به دوربین. لطفاً مجوز مرورگر را بررسی کنید.";
      console.error("AR Error:", e);
    });

    target.addEventListener("targetFound", () => {
      statusBox.textContent = "منو پیدا شد! مدل سه‌بعدی ظاهر شد.";
    });

    target.addEventListener("targetLost", () => {
      statusBox.textContent = "منو گم شد. دوربین را روی منو نگه دارید.";
    });
  </script>
</body>
</html>
