<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>اسکن منوی کافه | AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Tahoma, sans-serif;
    }

    /* اجبار به نمایش ویدیوی دوربین زیر المان‌های AR */
    .mindar-ui-overlay {
      background: transparent !important;
    }
    
    video {
      object-fit: cover !important;
    }

    #back {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100000;
      padding: 11px 16px;
      color: #f4db98;
      background: rgba(20, 18, 15, .85);
      border: 1px solid #b9964e;
      border-radius: 14px;
      text-decoration: none;
    }

    #status {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100000;
      width: min(88vw, 430px);
      box-sizing: border-box;
      padding: 13px;
      color: white;
      background: rgba(20, 18, 15, .88);
      border: 1px solid #b9964e;
      border-radius: 15px;
      text-align: center;
      line-height: 1.8;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <a id="back" href="index.html">بازگشت به منو</a>
  <div id="status">درخواست دسترسی به دوربین... لطفاً اجازه دهید.</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: yes; uiScanning: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse"
      raycaster="objects: .clickable; far: 10000">
    </a-camera>

    <a-entity id="menu-target" mindar-image-target="targetIndex: 0">

      <!-- دکمه‌های لمسی روی منو -->
      <a-plane id="espresso-hit" class="clickable"
        position="0.25 0.55 0.005" width="0.31" height="0.048"
        material="color: #e5b95e; opacity: 0.4; transparent: true; side: double">
      </a-plane>

      <a-plane id="chocolate-hit" class="clickable"
        position="0.25 0.16 0.005" width="0.31" height="0.048"
        material="color: #e5b95e; opacity: 0.4; transparent: true; side: double">
      </a-plane>

      <a-plane id="cake-hit" class="clickable"
        position="-0.15 -0.65 0.005" width="0.31" height="0.048"
        material="color: #e5b95e; opacity: 0.4; transparent: true; side: double">
      </a-plane>

      <!-- مدل‌های سه‌بعدی محصولات -->
      <a-entity id="espresso-model" visible="false" position="0.25 0.55 0">
        <a-cylinder radius="0.05" height="0.06" color="#faf7ef" rotation="90 0 0"></a-cylinder>
      </a-entity>

      <a-entity id="chocolate-model" visible="false" position="0.25 0.16 0">
        <a-box width="0.06" height="0.06" depth="0.06" color="#5b2c1d"></a-box>
      </a-entity>

      <a-entity id="cake-model" visible="false" position="-0.15 -0.65 0">
        <a-box width="0.08" height="0.04" depth="0.08" color="#d44b59"></a-box>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const statusBox = document.querySelector("#status");
    const target = document.querySelector("#menu-target");
    const scene = document.querySelector("a-scene");

    const choices = [
      { hit: "espresso-hit", model: "espresso-model", name: "تک روبوستا" },
      { hit: "chocolate-hit", model: "chocolate-model", name: "هات چاکلت" },
      { hit: "cake-hit", model: "cake-model", name: "چیزکیک" }
    ];

    let menuVisible = false;

    scene.addEventListener("arReady", () => {
      statusBox.textContent = "دوربین آماده است؛ آن را به سمت عکس منو بگیرید.";
    });

    scene.addEventListener("arError", (e) => {
      statusBox.textContent = "خطا در دسترسی به دوربین. لطفاً تنظیمات مرورگر را بررسی کنید.";
      console.error("AR Error:", e);
    });

    target.addEventListener("targetFound", () => {
      menuVisible = true;
      statusBox.textContent = "منو پیدا شد! روی گزینه‌ها در صفحه بزنید.";
    });

    target.addEventListener("targetLost", () => {
      menuVisible = false;
      statusBox.textContent = "منو از کادر خارج شد. دوربین را روی منو نگه دارید.";
    });

    choices.forEach(item => {
      document.getElementById(item.hit).addEventListener("click", () => {
        if (!menuVisible) return;
        choices.forEach(other => {
          document.getElementById(other.model).setAttribute("visible", "false");
        });
        document.getElementById(item.model).setAttribute("visible", "true");
        statusBox.textContent = item.name + " انتخاب شد؛ مدل ظاهر شد.";
      });
    });
  </script>
</body>
</html>
