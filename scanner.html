<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی کافه لومیر</title>
    <!-- Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            background: #14120f; 
            color: #f4db98;
            font-family: Tahoma, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        header {
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1914;
            border-bottom: 1px solid #b9964e;
        }
        header a { color: #f4db98; text-decoration: none; }
        
        .menu-container { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            margin: 20px auto;
        }
        .menu-container img { 
            width: 100%; 
            display: block; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .hotspot { 
            position: absolute; 
            top: 5%; 
            left: 60%; 
            width: 32%; 
            height: 18%; 
            border: 2px dashed #b9964e;
            background: rgba(185, 150, 78, 0.25);
            cursor: pointer;
            border-radius: 6px;
        }

        #modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.85); 
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            position: relative;
            width: min(100%, 420px);
            background: #1c1914;
            border: 1px solid #b9964e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        model-viewer { 
            width: 100%; 
            height: 320px; 
            background: #201c17;
            border-radius: 8px;
            margin-top: 10px;
        }
        .close-btn { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            color: #f4db98; 
            background: transparent;
            border: 1px solid #b9964e;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer; 
        }

        /* استایل دکمه جذاب برای نمایش روی میز */
        #ar-button {
            background: #b9964e;
            color: #14120f;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: bold;
            font-family: Tahoma, sans-serif;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <strong>کافه لومیر</strong>
        <a href="./index.html">بازگشت</a>
    </header>

    <div class="menu-container">
        <img src="./menu.png" alt="منوی کافه">
        <div class="hotspot" id="btn-espresso" title="اسپرسو"></div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="document.getElementById('modal').style.display='none'">بستن ✕</button>
            <h3 style="margin: 0 0 10px 0; color: #f4db98;">فنجان اسپرسو</h3>
            
            <!-- اضافه شدن قابلیت AR برای قرارگیری روی میز -->
            <model-viewer 
                id="espresso-viewer"
                src="https://modelviewer.dev/shared-assets/models/CoffeeMug.glb" 
                ar
                ar-modes="scene-viewer quick-look webxr"
                camera-controls 
                touch-action="pan-y"
                auto-rotate 
                shadow-intensity="1">
                
                <button slot="ar-button" id="ar-button">
                    ✨ مشاهده روی میز (واقعیت افزوده)
                </button>
            </model-viewer>

            <p style="font-size: 11px; color: #d1b87a; margin-top: 10px;">با گوشی روی دکمه بالا بزنید تا مدل روی میزتان ظاهر شود</p>
        </div>
    </div>

    <script>
        document.getElementById('btn-espresso').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'flex';
        });
    </script>
</body>
</html>
