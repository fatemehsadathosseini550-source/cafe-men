<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منوی سه‌بعدی کافه لومیر</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #14120f;
      color: #f4db98;
      font-family: Tahoma, sans-serif;
    }

    header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1914;
      border-bottom: 1px solid #b9964e;
    }

    a { color: #f4db98; }

    .hint {
      margin: 16px;
      text-align: center;
      font-size: 14px;
    }

    .menu-wrap {
      position: relative;
      width: min(100%, 647px);
      margin: 0 auto;
    }

    .menu-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* محل بخش اسپرسو روی عکس منو */
    .espresso-hotspot {
      position: absolute;
      left: 61%;
      top: 5.5%;
      width: 32%;
      height: 18%;
      border: 2px solid #b9964e;
      border-radius: 12px;
      background: rgba(185, 150, 78, 0.12);
      cursor: pointer;
    }

    .espresso-hotspot:active {
      background: rgba(185, 150, 78, 0.35);
    }

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.88);
    }

    .viewer[hidden] { display: none; }

    .viewer-box {
      width: min(100%, 680px);
      padding: 16px;
      border: 1px solid #b9964e;
      border-radius: 18px;
      background: #1c1914;
    }

    .viewer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .viewer-top h2 { margin: 0; font-size: 18px; }

    .close {
      padding: 8px 14px;
      color: #f4db98;
      background: transparent;
      border: 1px solid #b9964e;
      border-radius: 8px;
      cursor: pointer;
    }

    iframe {
      display: block;
      width: 100%;
      height: min(65vh, 500px);
      border: 0;
      border-radius: 10px;
    }

    .credit {
      margin: 10px 0 0;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <strong>منوی کافه لومیر</strong>
    <a href="./index.html">بازگشت</a>
  </header>

  <p class="hint">برای دیدن مدل سه‌بعدی، روی بخش «اسپرسو» در منو بزن.</p>

  <main class="menu-wrap">
    <img src="./menu.png" alt="تصویر منوی کافه">
    <button
      class="espresso-hotspot"
      id="espressoButton"
      type="button"
      aria-label="نمایش مدل سه‌بعدی اسپرسو">
    </button>
  </main>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-box" role="dialog" aria-modal="true" aria-label="مدل سه‌بعدی اسپرسو">
      <div class="viewer-top">
        <h2>اسپرسو ☕</h2>
        <button class="close" id="closeButton" type="button">بستن ×</button>
      </div>

      <iframe
        id="espressoModel"
        title="مدل سه‌بعدی فنجان اسپرسو"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>

      <p class="credit">
        مدل نمونه:
        <a href="https://sketchfab.com/3d-models/coffee-cup-espresso-cup-dbfdde7ba33b401ea145b3b7cfaba657"
           target="_blank" rel="noopener noreferrer">Just Vy در Sketchfab</a>
        — CC BY
      </p>
    </div>
  </div>

  <script>
    const viewer = document.getElementById("viewer");
    const model = document.getElementById("espressoModel");

    document.getElementById("espressoButton").addEventListener("click", () => {
      model.src =
        "https://sketchfab.com/models/dbfdde7ba33b401ea145b3b7cfaba657/embed?autostart=1";
      viewer.hidden = false;
      document.body.style.overflow = "hidden";
    });

    function closeViewer() {
      viewer.hidden = true;
      model.removeAttribute("src");
      document.body.style.overflow = "";
    }

    document.getElementById("closeButton").addEventListener("click", closeViewer);

    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) closeViewer();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !viewer.hidden) closeViewer();
    });
  </script>
</body>
</html>
