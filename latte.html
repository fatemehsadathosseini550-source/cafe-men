<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قهوه تک ربوستا | کافه فاماد</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script
    type="module"
src="https://fatemehsadathosseini550-source.github.io/cafe-famad/models/latte_macchiato.glb"
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Vazirmatn", sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      background: #fdfbf7;
      color: #2b1810;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      padding: 8px 16px;
      border-radius: 8px;
      background: #f0e6d2;
      color: #4a2c11;
      text-decoration: none;
      font-weight: 700;
    }

    .product-card {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      border: 1px solid #eee4d6;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 10px 30px #00000012;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 380px;
      border-radius: 15px;
      background: #f5efe6;
    }

    .ar-button {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      background: #4a2c11;
      color: white;
      font-size: 15px;
      white-space: nowrap;
    }

    .info-section {
      margin-top: 20px;
      line-height: 1.8;
    }

    h1 {
      color: #4a2c11;
      font-size: 1.4rem;
    }

    .description {
      margin-top: 8px;
      color: #666;
    }

    .price {
      margin-top: 12px;
      color: #a96932;
      font-size: 1.2rem;
      font-weight: 800;
    }

    #model-error {
      display: none;
      margin-top: 12px;
      color: #a12622;
      text-align: center;
    }
  </style>
</head>

<body>
  <header class="header">
    <a class="back-btn" href="index.html">← بازگشت به منو</a>
    <strong>کافه فاماد</strong>
  </header>

  <main class="product-card">
    <model-viewer
      id="coffeeViewer"
      src="models/latte_macchiato.glb"
      alt="مدل سه‌بعدی نوشیدنی"
      ar
      ar-modes="quick-look scene-viewer webxr"
      camera-controls
      auto-rotate
      shadow-intensity="1">

      <button slot="ar-button" class="ar-button">
        مشاهده روی میز شما (AR)
      </button>
    </model-viewer>

    <p id="model-error">
      مدل بارگذاری نشد؛ مسیر و نام فایل مدل را بررسی کن.
    </p>

    <section class="info-section">
      <h1>قهوه تک ربوستا</h1>
      <p class="description">
        قهوه‌ای پرانرژی با کافئین بالا و کرمای غلیظ.
      </p>
      <p class="price">قیمت: ۶۵,۰۰۰ تومان</p>
    </section>
  </main>

  <script>
    const viewer = document.getElementById("coffeeViewer");

    viewer.addEventListener("error", () => {
      document.getElementById("model-error").style.display = "block";
    });
  </script>
</body>
</html>
