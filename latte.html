<!-- در قسمت بدنه (Body) فایل latte.html -->

<div class="model-container">
    <model-viewer 
        id="coffee-model"
        src="latte_macchiato.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        poster="poster.webp" 
        shadow-intensity="1" 
        auto-rotate 
        style="width: 100%; height: 500px; background-color: #f5f5dc;">
        
        <!-- دکمه ورود به حالت AR برای موبایل -->
        <button slot="ar-button" id="ar-button">
            مشاهده در محیط شما (AR)
        </button>

        <div id="ar-prompt">
            <img src="models/latte_macchiato.glb">
        </div>
    </model-viewer>
</div>
