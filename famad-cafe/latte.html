<!-- در قسمت بدنه (Body) فایل latte.html -->

<div class="model-container">
    <model-viewer 
        id="coffee-model"
        src="latte_macchiato.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        poster="poster.webp" 
        shadow-intensity="1" 
        auto-rotate 
        style="width: 100%; height: 500px; background-color: #f5f5dc;">
        
        <!-- دکمه ورود به حالت AR برای موبایل -->
        <button slot="ar-button" id="ar-button">
            مشاهده در محیط شما (AR)
        </button>

        <div id="ar-prompt">
            <img src="models/latte_macchiato.glb">
        </div>
    </model-viewer>
</div>

<!-- تنظیمات استایل برای دکمه AR -->
<style>
    #ar-button {
        background-color: #6f4e37;
        border-radius: 8px;
        border: none;
        position: absolute;
        bottom: 16px;
        right: 16px;
        padding: 12px 24px;
        color: white;
        font-family: 'Vazirmatn', sans-serif;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
</style>
